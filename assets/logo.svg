<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="RayRemote Release">
  <title>RayRemote Release</title>
  <!-- 沿用 RayRemote 官方品牌图形（深色圆角底板 + 窗口 + 绿色指针），
       右下角叠加「下载」角标，标识本仓为安装包分发仓。 -->
  <rect width="64" height="64" rx="14" fill="#161b18"/>
  <rect x="9" y="13" width="46" height="38" rx="7" fill="#26332c" stroke="#fff8ee" stroke-opacity=".2" stroke-width="1.5"/>
  <path d="M9 20 a7 7 0 0 1 7-7 h32 a7 7 0 0 1 7 7 v3 H9 Z" fill="#31443a"/>
  <circle cx="17" cy="18" r="2.1" fill="#ff6b5e"/>
  <circle cx="24" cy="18" r="2.1" fill="#ffd23e"/>
  <circle cx="31" cy="18" r="2.1" fill="#2fbf87"/>
  <rect x="15" y="29" width="19" height="3" rx="1.5" fill="#fff8ee" opacity=".5"/>
  <rect x="15" y="36" width="25" height="3" rx="1.5" fill="#fff8ee" opacity=".3"/>
  <rect x="15" y="43" width="14" height="3" rx="1.5" fill="#fff8ee" opacity=".18"/>
  <g transform="translate(36,28)">
    <path d="M0 0 L0 15.5 L3.8 12 L6.6 17.6 L9.3 16.4 L6.5 10.9 L11.8 10.9 Z"
          fill="#2fbf87" stroke="#161b18" stroke-width="1.4" stroke-linejoin="round"/>
  </g>
  <!-- Download badge -->
  <circle cx="52" cy="52" r="8.5" fill="#2fbf87" stroke="#161b18" stroke-width="2.2"/>
  <g fill="none" stroke="#fff8ee" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M52 47.4v5.4"/>
    <path d="M49.1 50.3 52 53.3l2.9-3"/>
    <path d="M48.6 55.6h6.8"/>
  </g>
</svg>
